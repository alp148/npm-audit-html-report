name: npm Security Audit

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm-audit-html-report
        run: |
          npx npm-audit-html-report \
            --production \
            --output reports \
            --theme dark \
            --title "${{ github.repository }} Security Report" \
            --fail-on high

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: reports/
          retention-days: 30
